name: Docs Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate public docs
        shell: bash
        run: |
          set -euo pipefail

          required=(
            README.md
            product-guide.md
            setup.md
            faq.md
            security-and-privacy.md
            assets/homepage.png
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing $file"
              exit 1
            fi
          done

          while IFS= read -r file; do
            case "$file" in
              ./.git/*|./.github/*)
                ;;
              ./README.md|./product-guide.md|./setup.md|./faq.md|./security-and-privacy.md|./assets/homepage.png)
                ;;
              *)
                echo "::error::Unexpected public docs file: ${file#./}"
                exit 1
                ;;
            esac
          done < <(find . -type f | sort)

          if [ ! -s assets/homepage.png ]; then
            echo "::error::assets/homepage.png is empty."
            exit 1
          fi

          if grep -RInE --include='*.md' '(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|DATABASE_URL[[:space:]]*=|[A-Z][A-Z0-9_]*(TOKEN|SECRET|PRIVATE_KEY)[[:space:]]*=)' .; then
            echo "::error::A document may contain a credential."
            exit 1
          fi

          python3 - <<'PYTHON'
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd()
          errors = []
          for document in root.glob("*.md"):
              for target in re.findall(r'!?\[[^\]]*\]\(([^)\s]+)(?:\s+"[^\"]*")?\)', document.read_text()):
                  if urlsplit(target).scheme or target.startswith("#"):
                      continue
                  destination = (document.parent / unquote(target.split("#")[0])).resolve()
                  if not destination.is_relative_to(root) or not destination.is_file():
                      errors.append(f"{document.name}: broken link to {target}")
          if errors:
              raise SystemExit("\n".join(errors))
          PYTHON
